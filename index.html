<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fb" />
  <meta name="description" content="주차 위치를 사진 한 장으로 기록하고, 돌아올 때 바로 확인하는 주차 기억 도우미." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="차여기" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>차여기 — 주차 위치 기록</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">P<span>·</span></span><div><strong>차여기</strong><span>잊지 않아도 되는 주차</span></div></div>
      <span class="beta-label">MVP BETA</span>
    </header>

    <main id="mainContent" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button type="button" data-nav="home" class="nav-item active" aria-label="현재 주차"><span data-icon="house"></span><span>현재 주차</span></button>
      <button type="button" data-nav="history" class="nav-item" aria-label="지난 기록"><span data-icon="clock-3"></span><span>지난 기록</span></button>
      <button type="button" data-nav="settings" class="nav-item" aria-label="설정"><span data-icon="settings-2"></span><span>설정</span></button>
    </nav>
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden />
  <input type="file" id="libraryInput" accept="image/*" hidden />
  <input type="file" id="entranceInput" accept="image/*" capture="environment" hidden />

  <dialog id="editDialog" class="edit-dialog" aria-labelledby="editTitle">
    <form id="editForm" novalidate>
      <div class="dialog-handle" aria-hidden="true"></div>
      <div class="dialog-head"><div><p class="eyebrow">주차 위치 편집</p><h2 id="editTitle">기록을 완성해 주세요</h2></div><button type="button" id="closeDialog" class="icon-button" aria-label="닫기"><span data-icon="x"></span></button></div>
      <div class="field"><label for="editPlace">주차한 건물 · 장소</label><input id="editPlace" maxlength="80" placeholder="예: ○○ 쇼핑몰 지하주차장" autocomplete="off" /></div>
      <div class="field-row">
        <div class="field"><label for="editFloor">층수</label><input id="editFloor" maxlength="12" placeholder="예: B3" autocomplete="off" /></div>
        <div class="field"><label for="editSection">구역</label><input id="editSection" maxlength="20" placeholder="예: C" autocomplete="off" /></div>
        <div class="field"><label for="editSpot">기둥·번호</label><input id="editSpot" maxlength="20" placeholder="예: 27" autocomplete="off" /></div>
      </div>
      <div class="field"><label for="editEntrance">출입구·엘리베이터</label><input id="editEntrance" maxlength="80" placeholder="예: 동쪽 5번 엘리베이터" autocomplete="off" /></div>
      <div class="field"><label for="editNote">추가 메모</label><textarea id="editNote" rows="2" maxlength="250" placeholder="돌아올 때 도움이 되는 단서"></textarea></div>
      <div class="hint"><span data-icon="shield-check"></span><span>수정한 내용은 이 기기에만 저장됩니다.</span></div>
      <button class="button button-primary button-full" type="submit">변경사항 저장 <span data-icon="check"></span></button>
    </form>
  </dialog>

  <dialog id="photoDialog" class="photo-dialog" aria-label="주차 사진 크게 보기">
    <div class="photo-dialog-head"><span id="photoTitle">사진 확인</span><button id="closePhoto" type="button" class="icon-button" aria-label="사진 닫기"><span data-icon="x"></span></button></div>
    <img id="photoPreview" alt="저장된 주차 위치 사진" />
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
