name: Publish Chayeogi MVP source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and unpack original source
        shell: bash
        run: |
          set -euo pipefail
          test -s source-package.tar.gz.b64
          base64 --decode source-package.tar.gz.b64 > /tmp/chayeogi-source.tar.gz
          tar -tzf /tmp/chayeogi-source.tar.gz
          tar -xzf /tmp/chayeogi-source.tar.gz -C .
          rm source-package.tar.gz.b64
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s manifest.webmanifest
          test -s sw.js
          test -s icons/icon-192.png
      - name: Commit extracted project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: publish Chayeogi parking MVP files"
          git push
